


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
  <rect width="500" height="300" fill="#ffffff"/>
  
  <!-- Гексагон -->
  <g transform="translate(130, 150)">
    <polygon points="0,-80 70,-40 70,40 0,80 -70,40 -70,-40" 
             fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/>
    <!-- Внутренний гексагон -->
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" 
             fill="#ffffff"/>
    
    <!-- Буквы T и O -->
    <text x="0" y="15" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="50" fill="#1a1a1a">TO</text>
    
    <!-- Три полосы внизу -->
    <rect x="-40" y="35" width="80" height="4" fill="#000000"/>
    <rect x="-40" y="42" width="80" height="4" fill="#DD0000"/>
    <rect x="-40" y="49" width="80" height="4" fill="#FFCE00"/>
  </g>
  
  <!-- Текст -->
  <text x="240" y="135" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="42" fill="#1a1a1a">TOJIKON</text>
  <text x="240" y="180" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="42" fill="#DD0000">OLMON</text>
  <text x="240" y="210" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666" letter-spacing="5">DEUTSCH-AKADEMIE</text>
</svg>