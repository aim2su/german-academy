<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <rect width="500" height="350" fill="#FAFAF5"/>
  
  <!-- Пузырь -->
  <g transform="translate(250, 150)">
    <path d="M-150,0 C-150,-70 -90,-110 0,-110 C90,-110 150,-70 150,0 C150,70 90,110 0,110 C-30,110 -60,105 -80,95 L-120,140 L-110,90 C-135,75 -150,45 -150,0 Z" 
          fill="#ffffff" stroke="#1a1a1a" stroke-width="5"/>
    
    <!-- Таджикский: буква "О" / "Ӯ" стилизованно -->
    <text x="-60" y="15" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="60" fill="#CC0000">Т</text>
    
    <!-- Разделитель -->
    <line x1="0" y1="-50" x2="0" y2="50" stroke="#1a1a1a" stroke-width="2"/>
    
    <!-- Немецкий: "D" -->
    <text x="60" y="15" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="60" fill="#1a1a1a">D</text>
    
    <!-- Маленький флаг в углу пузыря -->
    <g transform="translate(100, -80)">
      <rect x="0" y="0" width="30" height="7" fill="#000000"/>
      <rect x="0" y="7" width="30" height="7" fill="#DD0000"/>
      <rect x="0" y="14" width="30" height="7" fill="#FFCE00"/>
    </g>
  </g>
  
  <!-- Текст -->
  <text x="250" y="310" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="26" fill="#1a1a1a" letter-spacing="4">TOJIKON OLMON</text>
  <text x="250" y="335" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666" letter-spacing="6">DEUTSCH-AKADEMIE</text>
</svg>
