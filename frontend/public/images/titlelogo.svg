<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Чёрный гексагон -->
  <polygon points="32,4 56,18 56,46 32,60 8,46 8,18" 
           fill="#1a1a1a"/>
  
  <!-- Буквы TO белым (жирно) -->
